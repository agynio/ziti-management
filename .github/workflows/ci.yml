name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GO111MODULE: on
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.67.0'

      - name: Generate gRPC stubs
        run: |
          buf generate https://github.com/agynio/api.git#branch=noa/issue-60-api \
            --path proto/agynio/api/ziti_management/v1/ziti_management.proto

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  publish-pr-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish PR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/agynio/ziti-management:pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
